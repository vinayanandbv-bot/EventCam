<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Event Album</title>
  <link rel="stylesheet" href="styles.css?v=5">
</head>

<body>

  <div class="app-container">
    <!-- Header (shared across home/album, hidden in camera for full screen camera feeling) -->
    <header id="app-header">
      <h1>Event Cam</h1>
      <p>Scan, Click, and Share to the Album</p>
    </header>

    <!-- 1. HOME SCREEN -->
    <div id="screen-home" class="screen active">
      <div class="menu-grid">
        <!-- Take Photo Card -->
        <div class="menu-card" onclick="navigateTo('camera')">
          <div class="icon-wrapper">
            <!-- Camera SVG Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
              <circle cx="12" cy="13" r="3" />
            </svg>
          </div>
          <h2>Take Photo</h2>
          <p>Open your camera and snap a live photo directly to the album.</p>
        </div>

        <!-- View Album Card -->
        <div class="menu-card" onclick="navigateTo('album')">
          <div class="icon-wrapper">
            <!-- Grid/Album SVG Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
              <line x1="3" x2="21" y1="9" y2="9" />
              <line x1="3" x2="21" y1="15" y2="15" />
              <line x1="9" x2="9" y1="3" y2="21" />
              <line x1="15" x2="15" y1="3" y2="21" />
            </svg>
          </div>
          <h2>View Album</h2>
          <p>Browse all photos uploaded by guests. (View-only)</p>
        </div>
      </div>
    </div>

    <!-- 2. CAMERA SCREEN -->
    <div id="screen-camera" class="screen">
      <div class="camera-view-container">
        <div class="camera-header-controls">
          <button class="circle-btn" onclick="navigateTo('home')" title="Back to Home">
            <!-- Chevron Left SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button id="btn-flip" class="circle-btn" onclick="toggleCameraFacing()" title="Flip Camera">
            <!-- Flip Camera SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          </button>
        </div>
        <video id="camera-video" autoplay playsinline muted></video>
      </div>

      <div class="camera-bottom-controls">
        <button class="shutter-btn" onclick="capturePhoto()" title="Capture Photo"></button>
      </div>
    </div>

    <!-- 3. ALBUM SCREEN -->
    <div id="screen-album" class="screen">
      <div class="album-header">
        <a class="back-link" onclick="navigateTo('home')">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
          </svg>
          Back to Home
        </a>
        <span style="font-size: 0.9rem; color: var(--text-muted);" id="album-count">0 photos</span>
      </div>

      <!-- Photo Grid -->
      <div id="album-gallery" class="gallery-grid">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- PHOTO PREVIEW MODAL / POPUP -->
  <div id="preview-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="preview-image-container">
        <img id="preview-img" src="" alt="Captured Image Preview">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="retakePhoto()">
          <!-- Refresh/Undo Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
          Retake
        </button>
        <button id="btn-save" class="btn btn-primary" onclick="savePhoto()">
          <!-- Save Icon -->
          <svg id="save-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
            <polyline points="17 21 17 13 7 13 7 21" />
            <polyline points="7 3 7 8 15 8" />
          </svg>
          <span id="save-btn-text">Save Photo</span>
        </button>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX MODAL (Full screen view) -->
  <div id="lightbox" class="lightbox-modal" onclick="closeLightbox()">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
      <img id="lightbox-img" class="lightbox-img" src="" alt="Full Screen Photo">
      <div id="lightbox-caption" class="lightbox-caption">Uploaded on [date]</div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast">Message goes here</div>

  <!-- Hidden canvas for capturing frame -->
  <canvas id="capture-canvas" style="display: none;"></canvas>

  <script>
    // ==========================================
    // CONFIGURATION
    // Replace the URL below with your deployed Google Apps Script Web App URL
    // ==========================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwyKGNmaXUI2wBepJi-skrNrdMiaITwHlR1Byghw03LQ3FSQJg9b0YWXoT8i4LKiW4/exec';

    // Application State Variables
    let currentScreen = 'home';
    let cameraStream = null;
    let cameraFacingMode = 'environment'; // 'environment' = back cam, 'user' = front cam
    let capturedImageBase64 = null;

    // Element Selectors
    const videoEl = document.getElementById('camera-video');
    const canvasEl = document.getElementById('capture-canvas');
    const previewModal = document.getElementById('preview-modal');
    const previewImg = document.getElementById('preview-img');
    const btnSave = document.getElementById('btn-save');
    const saveIcon = document.getElementById('save-icon');
    const saveBtnText = document.getElementById('save-btn-text');
    const albumGallery = document.getElementById('album-gallery');
    const albumCountEl = document.getElementById('album-count');
    const lightboxModal = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');

    // Navigation function
    function navigateTo(screenId) {
      // Deactivate current active screens
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

      // Stop camera if leaving camera screen
      if (currentScreen === 'camera' && screenId !== 'camera') {
        stopCamera();
      }

      // Display header only on Home and Album screens
      const header = document.getElementById('app-header');
      if (screenId === 'camera') {
        header.style.display = 'none';
      } else {
        header.style.display = 'block';
      }

      // Activate new screen
      const targetScreen = document.getElementById(`screen-${screenId}`);
      if (targetScreen) {
        targetScreen.classList.add('active');
        currentScreen = screenId;
      }

      // Trigger action based on target screen
      if (screenId === 'camera') {
        startCamera();
      } else if (screenId === 'album') {
        loadAlbum();
      }
    }

    // ==========================================
    // CAMERA CONTROLLER
    // ==========================================
    async function startCamera() {
      try {
        if (cameraStream) {
          stopCamera();
        }

        const constraints = {
          video: {
            facingMode: cameraFacingMode,
            width: { min: 1024, ideal: 1920, max: 3840 },
            height: { min: 768, ideal: 1080, max: 2160 }
          },
          audio: false
        };

        cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoEl.srcObject = cameraStream;

        // Dynamically adjust the camera box aspect ratio to match the camera stream sensor exactly
        videoEl.onloadedmetadata = () => {
          if (videoEl.videoWidth && videoEl.videoHeight) {
            const aspect = videoEl.videoWidth / videoEl.videoHeight;
            document.querySelector('.camera-view-container').style.aspectRatio = aspect;
          }
        };

        // Listen for resize/orientation changes to keep aspect ratio aligned
        window.addEventListener('resize', () => {
          if (currentScreen === 'camera' && videoEl && videoEl.videoWidth) {
            const aspect = videoEl.videoWidth / videoEl.videoHeight;
            document.querySelector('.camera-view-container').style.aspectRatio = aspect;
          }
        });

        // Mirror front camera feed (for selfie mode)
        if (cameraFacingMode === 'user') {
          videoEl.style.transform = 'scaleX(-1)';
        } else {
          videoEl.style.transform = 'scaleX(1)';
        }
      } catch (err) {
        console.error('Camera access error:', err);
        showToast('Unable to access camera. Please ensure permissions are granted and you are using HTTPS.', 'error');
        navigateTo('home');
      }
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
        videoEl.srcObject = null;
      }
    }

    function toggleCameraFacing() {
      cameraFacingMode = (cameraFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    }

    function capturePhoto() {
      if (!cameraStream) return;

      const videoWidth = videoEl.videoWidth;
      const videoHeight = videoEl.videoHeight;

      // Limit resolution to a maximum of 1920px on the longest edge
      const maxDimension = 1920;
      let targetWidth = videoWidth;
      let targetHeight = videoHeight;

      if (videoWidth > maxDimension || videoHeight > maxDimension) {
        if (videoWidth > videoHeight) {
          targetHeight = Math.round((videoHeight * maxDimension) / videoWidth);
          targetWidth = maxDimension;
        } else {
          targetWidth = Math.round((videoWidth * maxDimension) / videoHeight);
          targetHeight = maxDimension;
        }
      }

      canvasEl.width = targetWidth;
      canvasEl.height = targetHeight;

      const ctx = canvasEl.getContext('2d');

      // If mirrored (front-facing), mirror the canvas render too
      if (cameraFacingMode === 'user') {
        ctx.translate(targetWidth, 0);
        ctx.scale(-1, 1);
      }

      ctx.drawImage(videoEl, 0, 0, targetWidth, targetHeight);

      // Reset transform if altered
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      // Convert to JPEG format with 88% quality to guarantee file size of 800KB - 1MB
      capturedImageBase64 = canvasEl.toDataURL('image/jpeg', 0.88);

      // Show in preview modal and match the image aspect ratio dynamically
      previewImg.src = capturedImageBase64;
      const previewContainer = document.querySelector('.preview-image-container');
      previewContainer.style.aspectRatio = `${targetWidth} / ${targetHeight}`;
      previewModal.classList.add('active');

      // Keep background camera running or pause it
      videoEl.pause();
    }

    function retakePhoto() {
      previewModal.classList.remove('active');
      previewImg.src = '';
      capturedImageBase64 = null;
      videoEl.play();
    }

    // ==========================================
    // SAVE PHOTO (POST Request to Drive)
    // ==========================================
    async function savePhoto() {
      if (!capturedImageBase64) return;

      if (APPS_SCRIPT_URL === 'YOUR_DEPLOYED_WEB_APP_URL_HERE') {
        showToast('Google Apps Script URL is not configured. Please paste your URL into index.html.', 'error');
        return;
      }

      // Show spinner / loading state
      btnSave.disabled = true;
      const originalHTML = btnSave.innerHTML;
      btnSave.innerHTML = `<span class="spinner"></span> <span>Saving...</span>`;

      try {
        // Send a simple POST request (avoids preflight OPTIONS triggers)
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            image: capturedImageBase64
          })
        });

        const result = await response.json();

        if (result.success) {
          showToast('Photo saved to Google Drive album!', 'success');
          previewModal.classList.remove('active');
          capturedImageBase64 = null;
          videoEl.play(); // Stay on camera and resume live feed
        } else {
          throw new Error(result.error || 'Server returned an error');
        }
      } catch (err) {
        console.error('Upload failed:', err);
        showToast(`Save failed: ${err.message || 'Unknown network error'}`, 'error');
      } finally {
        // Reset loading states
        btnSave.disabled = false;
        btnSave.innerHTML = originalHTML;
      }
    }

    // ==========================================
    // VIEW ALBUM (GET Request to Apps Script)
    // ==========================================
    async function loadAlbum() {
      if (APPS_SCRIPT_URL === 'YOUR_DEPLOYED_WEB_APP_URL_HERE') {
        albumGallery.innerHTML = `
          <div class="no-photos">
            Google Apps Script URL is not configured.<br>
            Please set the APPS_SCRIPT_URL configuration in index.html.
          </div>`;
        albumCountEl.textContent = '0 photos';
        return;
      }

      albumGallery.innerHTML = `<div style="grid-column: 1/-1; display:flex; justify-content:center;"><span class="spinner spinner-large"></span></div>`;

      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const result = await response.json();

        if (result.success) {
          renderGallery(result.images);
        } else {
          throw new Error(result.error || 'Failed to retrieve files.');
        }
      } catch (err) {
        console.error('Error fetching album:', err);
        albumGallery.innerHTML = `
          <div class="no-photos" style="border-color: rgba(239, 68, 68, 0.2);">
            Failed to load gallery.<br>
            <span style="font-size: 0.8rem; opacity: 0.8;">${err.message || 'Check browser console / connection'}</span>
          </div>`;
        albumCountEl.textContent = 'Error';
      }
    }

    function renderGallery(images) {
      if (!images || images.length === 0) {
        albumGallery.innerHTML = `<div class="no-photos">No photos in the album yet.<br>Be the first to click a picture!</div>`;
        albumCountEl.textContent = '0 photos';
        return;
      }

      albumCountEl.textContent = `${images.length} photo${images.length === 1 ? '' : 's'}`;
      albumGallery.innerHTML = '';

      images.forEach(img => {
        const item = document.createElement('div');
        item.className = 'gallery-item';

        // Use Google Drive direct layout URL
        // Display fallback loader inside thumbnail img loading
        item.innerHTML = `<img src="${img.url}" alt="${img.name}" loading="lazy" onerror="this.src='https://placehold.co/300x400/1e293b/a5b4fc?text=Failed+to+load'">`;

        const formattedDate = new Date(img.created).toLocaleString(undefined, {
          dateStyle: 'medium',
          timeStyle: 'short'
        });

        item.onclick = () => openLightbox(img.url, `Uploaded on ${formattedDate}`);
        albumGallery.appendChild(item);
      });
    }

    // ==========================================
    // LIGHTBOX AND TOAST CONTROLLERS
    // ==========================================
    function openLightbox(src, caption) {
      lightboxImg.src = src;
      lightboxCaption.textContent = caption;
      lightboxModal.classList.add('active');
    }

    function closeLightbox() {
      lightboxModal.classList.remove('active');
      lightboxImg.src = '';
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast show ${type}`;

      setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }
  </script>
</body>

</html>
